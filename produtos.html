<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacau Show - Produtos</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <aside>
        <h2>Cacau Show</h2>
        <nav>
            <a href="index.html">🛒 Vendas</a>
            <a href="produtos.html" class="active">🍫 Produtos</a>
            <a href="relatorios.html">📊 Relatórios</a>
            <a href="usuarios.html">👥 Usuários</a>
        </nav>
    </aside>

    <main>
        <h1>Gerenciamento de Produtos</h1>
        
        <div class="card">
            <h3>Cadastrar Novo Produto</h3>
            <form id="form-produto">
                <input type="text" id="nome" placeholder="Nome do produto (ex: Trufa 30g)" required>
                <input type="number" step="0.01" id="preco" placeholder="Preço (R$)" required>
                <input type="number" id="estoque" placeholder="Quantidade em estoque" required>
                <button type="submit">Salvar Produto</button>
            </form>
        </div>

        <div class="card">
            <h3>Produtos Cadastrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
